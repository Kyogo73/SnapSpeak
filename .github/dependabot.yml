version: 2
updates:
  # GitHub Actions のバージョンピン更新（actions/checkout 等）
  - package-ecosystem: github-actions
    directory: /
    # 依存更新も feature と同じく develop 経由でリリースする（main 直行禁止）
    target-branch: develop
    schedule:
      interval: weekly
    labels: []
    commit-message:
      prefix: ci
  # SwiftPM 依存（swift-crypto 等）の更新
  - package-ecosystem: swift
    directory: /Packages/SnapSpeakCore
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
