name: SnapSpeak
options:
  bundleIdPrefix: app.snapspeak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SnapSpeakiOS:
    path: ../Packages/SnapSpeakiOS
  SnapSpeakCore:
    path: ../Packages/SnapSpeakCore
targets:
  SnapSpeak:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: ../Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../Resources/Seed
        type: folder
        buildPhase: resources
    info:
      path: SnapSpeak-Info.plist
      properties:
        CFBundleDisplayName: SnapSpeak
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          シャドーイングと瞬間英作文の練習のため、お手本に合わせて発話を録音します。録音は端末内に保存し、既定で14日後に削除します。
        NSSpeechRecognitionUsageDescription: >-
          録音した発話を端末内で認識し、お手本スクリプトとの一致を採点します。認識はオンデバイスで行い、録音は既定で14日間保持します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.SnapSpeak
        PRODUCT_NAME: SnapSpeak
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SnapSpeakiOS
        product: AppFeature
  # ホストアプリを使わないロジックテスト。SwiftPM の静的ライブラリ製品を直接リンクする
  # （bundle_loader 経由だと SPM 製品のシンボルがホストアプリから解決できずリンク失敗する）。
  PersistenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/PersistenceTests
    dependencies:
      - package: SnapSpeakiOS
        product: Persistence
      - package: SnapSpeakCore
        product: SRSKit
      - package: SnapSpeakCore
        product: ContentCore
      - package: SnapSpeakCore
        product: HabitKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.PersistenceTests
  ContentKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/ContentKitTests
    dependencies:
      - package: SnapSpeakiOS
        product: ContentKit
      - package: SnapSpeakCore
        product: ContentCore
      - package: SnapSpeakCore
        product: LanguageKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.ContentKitTests
  ReviewFeatureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/ReviewFeatureTests
    dependencies:
      - package: SnapSpeakiOS
        product: ReviewFeature
      - package: SnapSpeakiOS
        product: Analytics
      - package: SnapSpeakiOS
        product: ContentKit
      - package: SnapSpeakiOS
        product: Persistence
      - package: SnapSpeakCore
        product: HabitKit
      - package: SnapSpeakCore
        product: ContentCore
      - package: SnapSpeakCore
        product: LanguageKit
      - package: SnapSpeakCore
        product: SRSKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.ReviewFeatureTests
  NotificationsKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/NotificationsKitTests
    dependencies:
      - package: SnapSpeakiOS
        product: NotificationsKit
      - package: SnapSpeakiOS
        product: Analytics
      - package: SnapSpeakCore
        product: HabitKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.NotificationsKitTests
  OnboardingFeatureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/OnboardingFeatureTests
    dependencies:
      - package: SnapSpeakiOS
        product: OnboardingFeature
      - package: SnapSpeakiOS
        product: Persistence
      - package: SnapSpeakiOS
        product: NotificationsKit
      - package: SnapSpeakiOS
        product: Analytics
      - package: SnapSpeakCore
        product: HabitKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.OnboardingFeatureTests
  CompositionFeatureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/CompositionFeatureTests
    dependencies:
      - package: SnapSpeakiOS
        product: CompositionFeature
      - package: SnapSpeakiOS
        product: Persistence
      - package: SnapSpeakiOS
        product: SpeechKit
      - package: SnapSpeakiOS
        product: Analytics
      - package: SnapSpeakiOS
        product: AudioEngine
      - package: SnapSpeakiOS
        product: ContentKit
      - package: SnapSpeakCore
        product: ContentCore
      - package: SnapSpeakCore
        product: LanguageKit
      - package: SnapSpeakCore
        product: CompositionKit
      - package: SnapSpeakCore
        product: SRSKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.CompositionFeatureTests
  AppFeatureTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/AppFeatureTests
    dependencies:
      - package: SnapSpeakiOS
        product: AppFeature
      - package: SnapSpeakiOS
        product: ReviewFeature
      - package: SnapSpeakiOS
        product: Persistence
      - package: SnapSpeakiOS
        product: NotificationsKit
      - package: SnapSpeakiOS
        product: Analytics
      - package: SnapSpeakCore
        product: HabitKit
      - package: SnapSpeakCore
        product: SRSKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.AppFeatureTests
schemes:
  SnapSpeak:
    build:
      targets:
        SnapSpeak: all
  SnapSpeakiOSTests:
    build:
      targets:
        SnapSpeak: all
        PersistenceTests: [test]
        ContentKitTests: [test]
        ReviewFeatureTests: [test]
        NotificationsKitTests: [test]
        OnboardingFeatureTests: [test]
        CompositionFeatureTests: [test]
        AppFeatureTests: [test]
    test:
      config: Debug
      targets:
        - PersistenceTests
        - ContentKitTests
        - ReviewFeatureTests
        - NotificationsKitTests
        - OnboardingFeatureTests
        - CompositionFeatureTests
        - AppFeatureTests
