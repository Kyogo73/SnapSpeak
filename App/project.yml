name: SnapSpeak
options:
  bundleIdPrefix: app.snapspeak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  SnapSpeakiOS:
    path: ../Packages/SnapSpeakiOS
  SnapSpeakCore:
    path: ../Packages/SnapSpeakCore
targets:
  SnapSpeak:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: ../Resources/Localizable.xcstrings
        buildPhase: resources
      - path: ../Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../Resources/Seed
        type: folder
        buildPhase: resources
    info:
      path: SnapSpeak-Info.plist
      properties:
        CFBundleDisplayName: SnapSpeak
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: >-
          シャドーイングと瞬間英作文の練習のため、お手本に合わせて発話を録音します。録音は端末内に保存し、既定で14日後に削除します。
        NSSpeechRecognitionUsageDescription: >-
          録音した発話を端末内で認識し、お手本スクリプトとの一致を採点します。認識はオンデバイスで行い、録音は既定で14日間保持します。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.SnapSpeak
        PRODUCT_NAME: SnapSpeak
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SnapSpeakiOS
        product: AppFeature
  PersistenceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/PersistenceTests
    dependencies:
      - target: SnapSpeak
      - package: SnapSpeakiOS
        product: Persistence
      - package: SnapSpeakCore
        product: SRSKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.PersistenceTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SnapSpeak.app/SnapSpeak"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ContentKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../Packages/SnapSpeakiOS/Tests/ContentKitTests
    dependencies:
      - target: SnapSpeak
      - package: SnapSpeakiOS
        product: ContentKit
      - package: SnapSpeakCore
        product: ContentCore
      - package: SnapSpeakCore
        product: LanguageKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.snapspeak.ContentKitTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SnapSpeak.app/SnapSpeak"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SnapSpeak:
    build:
      targets:
        SnapSpeak: all
  SnapSpeakiOSTests:
    build:
      targets:
        SnapSpeak: all
        PersistenceTests: [test]
        ContentKitTests: [test]
    test:
      config: Debug
      targets:
        - PersistenceTests
        - ContentKitTests
