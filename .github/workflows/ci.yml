name: CI
on:
  # PR はベースブランチを問わず常に CI を回す（develop 未作成の移行期間中、
  # cursor/* 宛 PR もゲートするため。develop/main 宛 PR は当然含まれる）。
  pull_request:
  push:
    branches: [develop, main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    container: ghcr.io/realm/swiftlint:0.57.0
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --strict

  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.1-noble
    defaults: { run: { working-directory: Packages/SnapSpeakCore } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Packages/SnapSpeakCore/.build
          key: spm-linux-${{ hashFiles('Packages/SnapSpeakCore/Package.resolved', '.swift-version') }}
      - run: swift build --build-tests
      - run: swift test
      - run: swift run contentlint ../../Resources/Seed/course_daily_ja_en/index.json --audio-root ../../Resources/Seed/course_daily_ja_en

  ios-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: actions/cache@v4
        with:
          path: |
            Packages/SnapSpeakCore/.build
            ~/Library/Developer/Xcode/DerivedData
          key: spm-macos-${{ hashFiles('**/Package.resolved', '.swift-version') }}
      - run: swift test --package-path Packages/SnapSpeakCore
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - run: xcodegen generate --spec App/project.yml
      # デバイス名固定（例 iPhone 16）だと、xcode-select 直後に CoreSimulator が
      # デバイス列挙に失敗する既知の不安定事象で "Unable to find a device" になる。
      # 利用可能な iPhone シミュレータをリトライ付きで動的に選択する。
      - name: Select iPhone simulator
        id: sim
        run: |
          UDID=""
          for attempt in 1 2 3 4 5; do
            UDID=$(xcrun simctl list devices available --json \
              | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.isAvailable and (.name | startswith("iPhone")))][0].udid // empty')
            if [ -n "$UDID" ]; then break; fi
            echo "No available iPhone simulator yet (attempt $attempt); retrying..."
            sleep 15
          done
          if [ -z "$UDID" ]; then
            echo "::error::No available iPhone simulator found"
            xcrun simctl list devices
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - run: xcodebuild build -project App/SnapSpeak.xcodeproj -scheme SnapSpeak -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO
      - run: xcodebuild test -project App/SnapSpeak.xcodeproj -scheme SnapSpeakiOSTests -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO
